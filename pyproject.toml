[project]
name = "competitor-catalog"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Ismael Lucas de Leyssac", email = "ilucasdelayssac@isagri.fr" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "cssselect>=1.6.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[project.scripts]
catalog-scraper = "competitor_catalog.cli:main"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: requires a PostgreSQL database (TEST_DATABASE_URL)",
    "live: performs real Scrape.do requests (opt-in with --live, costs credits)",
]
