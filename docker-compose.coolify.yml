# Server deployment (Coolify "Docker Compose" build pack).
#
# Nothing scrapes by default: the worker only executes jobs requested through the API
# (POST /api/v1/competitors/{key}/worker/start). AUTO_SCHEDULE=true enables the optional
# periodic schedule (CATALOG_SYNC_INTERVAL_DAYS / PRICE_REFRESH_INTERVAL_HOURS).
#
# Coolify environment variables (secrets never in git):
#   SCRAPEDO_API_KEY            required (worker; the API uses it for /scrapedo/account)
#   VOYAGE_API_KEY              product matching (worker: embeddings; API: availability);
#                               optional: without it matching is disabled
#   API_KEY                     required, clients send it as X-API-Key
#   SERVICE_PASSWORD_POSTGRES   generated by Coolify
#   SERVICE_FQDN_API_8000       generated by Coolify: public URL of the API
#   CORS_ORIGINS                optional, comma-separated frontend origins (default *)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: competitor_catalog
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper -d competitor_catalog"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["api"]
    environment:
      SERVICE_FQDN_API_8000: ${SERVICE_FQDN_API_8000}
      DATABASE_URL: postgresql+psycopg://scraper:${SERVICE_PASSWORD_POSTGRES}@db:5432/competitor_catalog
      API_KEY: ${API_KEY:?API_KEY must be set}
      SCRAPEDO_API_KEY: ${SCRAPEDO_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    expose:
      - "8000"
    # Coolify reads this healthcheck (container status, deployments). The image has no curl/wget:
    # Python checks that GET /api/v1/health answers HTTP 200 (no API key needed). First check
    # 15 s after start (start_interval, Docker Engine >= 25), then every 120 s; 5 s timeout,
    # unhealthy after 3 failures in a row.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4).status == 200 else 1)"
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 15s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://scraper:${SERVICE_PASSWORD_POSTGRES}@db:5432/competitor_catalog
      SCRAPEDO_API_KEY: ${SCRAPEDO_API_KEY:?SCRAPEDO_API_KEY must be set}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      AUTO_SCHEDULE: ${AUTO_SCHEDULE:-false}
      WORKER_AUTO_RESUME: ${WORKER_AUTO_RESUME:-true}
      CATALOG_SYNC_INTERVAL_DAYS: ${CATALOG_SYNC_INTERVAL_DAYS:-180}
      PRICE_REFRESH_INTERVAL_HOURS: ${PRICE_REFRESH_INTERVAL_HOURS:-168}
      WORKER_MAX_CONCURRENT_JOBS: ${WORKER_MAX_CONCURRENT_JOBS:-4}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # SIGTERM lets running jobs stop after the current page and close as "interrupted".
    stop_grace_period: 90s
    # No healthcheck: Coolify leaves it out of the application status (otherwise "running (unknown)").
    # Worker liveness is reported by GET /api/v1/health (worker.online).
    exclude_from_hc: true
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
