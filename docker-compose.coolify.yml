# Server deployment (Coolify "Docker Compose" build pack).
# Secrets/settings are Coolify environment variables:
#   SCRAPEDO_API_KEY            (required, set in Coolify, never in git)
#   SERVICE_PASSWORD_POSTGRES   (generated by Coolify)
#   CATALOG_SYNC_INTERVAL_DAYS  (default 180) / PRICE_REFRESH_INTERVAL_HOURS (default 168, 0 = off)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: competitor_catalog
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper -d competitor_catalog"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://scraper:${SERVICE_PASSWORD_POSTGRES}@db:5432/competitor_catalog
      SCRAPEDO_API_KEY: ${SCRAPEDO_API_KEY:?SCRAPEDO_API_KEY must be set}
      CATALOG_SYNC_INTERVAL_DAYS: ${CATALOG_SYNC_INTERVAL_DAYS:-180}
      PRICE_REFRESH_INTERVAL_HOURS: ${PRICE_REFRESH_INTERVAL_HOURS:-168}
      WORKER_COMPETITORS: ${WORKER_COMPETITORS:-antalis_fr}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
